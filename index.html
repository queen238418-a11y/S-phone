<script>
/* ==================================================

const $ = id => document.getElementById(id);

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

function safeURL(value) {
  if (!value) return "";
  try {
    const url = new URL(value, location.href);
    return ["http:", "https:", "file:"].includes(url.protocol)
      ? url.href : "";
  } catch {
    return "";
  }
}

function img(src, className = "", alt = "") {
  return `<img src="${esc(safeURL(src))}"
    class="${className}" alt="${esc(alt)}" loading="lazy">`;
}

const SHAPES = {

function icon(name, className = "") {
  if (name === "photos") {
    const colors = [
      "#ff6869", "#ffae4b", "#f7da53", "#92cb5d",
      "#56bfc4", "#688de5", "#a078d0", "#e680b4"
    ];

    return `<svg class="${className}" viewBox="0 0 24 24"
      aria-hidden="true">
      ${colors.map((color, i) => `
        <ellipse cx="12" cy="6.7" rx="3.1" ry="5.2"
          fill="${color}" fill-opacity=".85"
          transform="rotate(${i * 45} 12 12)"/>
      `).join("")}
    </svg>`;
  }

  return `<svg class="${className}" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" stroke-width="1.8"
    stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true">${SHAPES[name] || SHAPES.news}</svg>`;
}

const STORAGE_KEY = "prison-iphone-final-1";
const clone = value => JSON.parse(JSON.stringify(value));

function initialState() {
  return {
    chats: clone(CONFIG.chats),
    notes: clone(CONFIG.notes),
    posts: clone(CONFIG.posts),
    unread: {},
    likes: [],
    bookmarks: [],
    calls: [],
    completedEvents: [],
    liveClock: CONFIG.liveClock
  };
}

let state = initialState();

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");

  if (saved && Array.isArray(saved.notes) && Array.isArray(saved.posts)) {
    state = { ...state, ...saved };
  }
} catch {}

let storageWarned = false;

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch {
    if (!storageWarned) {
      storageWarned = true;
      toast("이 브라우저에서는 변경 내용이 저장되지 않을 수 있어.");
    }
  }
}

  {

const APPS = [

  { id: "twitter", name: "트위터" },
  { id: "notes", name: "메모" },
  { id: "internet", name: "인터넷" },

];

function uid(prefix) {
  return prefix + "-" + Date.now() + "-" +
    Math.random().toString(36).slice(2, 7);
}

function contact(id) {
  return CONFIG.contacts.find(c => c.id === id) || {
    id,
    name: id,
    emoji: "👤",
    number: id,
    callLines: []
  };
}

function avatar(person) {
  return `<span class="avatar">${esc(person.emoji || "👤")}</span>`;
}

function nowTime() {
  return new Date().toLocaleTimeString("ko-KR", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });
}

function getChat(id) {
  if (!Array.isArray(state.chats[id])) {
    state.chats[id] = [];
  }
  return state.chats[id];
}

function fit() {
  const mobile = innerWidth <= 450;
  const margin = mobile ? 0 : 40;

  const scale = Math.max(.1, Math.min(
    (innerWidth - margin) / 390,
    (innerHeight - margin) / 844
  ));

  $("stage").style.width = 390 * scale + "px";
  $("stage").style.height = 844 * scale + "px";
  $("stage").style.marginTop =
    Math.max(0, (innerHeight - 844 * scale) / 2) + "px";

  $("phone").style.transform = `scale(${scale})`;
}

addEventListener("resize", fit);
fit();

$("phone").style.setProperty("--lock-color", CONFIG.lockColor);
$("carrier").textContent = CONFIG.carrier;

const battery = Math.max(0, Math.min(100, Number(CONFIG.battery) || 0));

$("batteryNumber").textContent = battery;
$("batteryFill").style.width = battery + "%";
$("batteryIcon").setAttribute("aria-label", `배터리 ${battery}퍼센트`);

if (CONFIG.wallpaper) {
  $("wallpaper").style.backgroundImage =
    `url(${JSON.stringify(safeURL(CONFIG.wallpaper))})`;
}

function clockParts() {
  if (!state.liveClock) {
    return { time: CONFIG.time, date: CONFIG.date };
  }

  const d = new Date();

  return {
    time: d.toLocaleTimeString("en-US", {
      hour: "numeric",
      minute: "2-digit",
      hour12: true
    }).replace(/\s?(AM|PM)/, ""),

    date: `${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`
  };
}

function updateClock() {
  const c = clockParts();

  if ($("lockTime")) $("lockTime").textContent = c.time;
  if ($("lockDate")) $("lockDate").textContent = c.date;
}

setInterval(updateClock, 1000);

function updateChrome() {
  const light = ["home", "lock"].includes(view.app);
  const dark = view.app === "internet";

  $("phone").style.setProperty(
    "--status-color",
    light ? CONFIG.statusColor : dark ? "#fff" : "#111"
  );

  $("phone").style.setProperty(
    "--bar-color",
    light ? CONFIG.lockColor : dark ? "#fff" : "#111"
  );

  $("phone").style.setProperty(
    "--battery-empty",
    light ? "#ffffff55" : dark ? "#777" : "#aaa"
  );

  $("phone").style.setProperty(
    "--battery-number",
    light ? "#b9adb9" : dark ? "#777" : "#aaa"
  );

  $("homebar").setAttribute(
    "aria-label",
    view.app === "lock" ? "잠금 해제" : "홈 화면"
  );
}

function go(app, extra = {}) {
  if (activeCall) return;

  view = { app, ...extra };
  render();
}

function appbar(title, backAction = "home", right = "") {
  return `
    <header class="appbar">
      <button data-action="${backAction}" aria-label="뒤로">
        ${icon("back")}${backAction === "home" ? "홈" : "뒤로"}
      </button>
      <h1>${esc(title)}</h1>
      ${right}
    </header>
  `;
}

function render() {
  updateChrome();

  const screens = {
    lock: renderLock,
    home: renderHome,
    messages: renderMessages,
    notes: renderNotes,
    twitter: renderTwitter,
    phone: renderPhone,
    internet: renderInternet,
    photos: renderPhotos,
    settings: renderSettings
  };

  $("main").innerHTML = screens[view.app]();

  if (view.app === "lock") updateClock();

  if (view.app === "messages" && view.id) {
    scrollChat();
  }
}

function scrollChat() {
  const box = $("chatContent");
  if (box) box.scrollTop = box.scrollHeight;
}

function sendMessage(text) {
  text = text.trim();
  if (!text || !view.id) return;

  const id = view.id;

  getChat(id).push({
    me: true,
    text,
    time: nowTime()
  });

  save();
  render();
  $("messageInput")?.focus();

  function normalize(value) {
    return String(value)
      .normalize("NFKC")
      .replace(/[\s.,!?~。、！？…]+/g, "")
      .toLowerCase();
  }

  const rule = CONFIG.autoReplies[id];
  const sentText = normalize(text);

  const matched = rule?.keywords?.find(item => {
    return item.words.some(word => {
      const keyword = normalize(word);

      return keyword !== "" &&
        sentText.includes(keyword);
    });
  });

  const reply = matched
    ? matched.replies
    : rule?.default;

  const replies = Array.isArray(reply)
    ? reply
    : reply ? [reply] : [];

  replies.forEach((replyText, index) => {
    replyTimers.push(setTimeout(() => {
      receiveMessage(id, replyText);
    }, 1900 + index * 1800));
  });
}

function receiveMessage(id, text) {
  const message = {
    me: false,
    text,
    time: nowTime()
  };

  getChat(id).push(message);

  const reading =
    view.app === "messages" &&
    view.id === id &&
    !activeCall;

  if (!reading) {
    state.unread[id] =
      (state.unread[id] || 0) + 1;
  }

  save();

  if (reading) {
    const box = $("chatContent");

    const nearBottom =
      box.scrollHeight -
      box.scrollTop -
      box.clientHeight < 80;

    box.insertAdjacentHTML(
      "beforeend",
      bubbleHTML(message)
    );

    if (nearBottom) scrollChat();
    return;
  }

  showNotification(id, text);

  if (["lock", "home"].includes(view.app)) {
    render();
  } else if (
    view.app === "messages" &&
    !view.id
  ) {
    const query =
      document.querySelector(
        '[data-search="messages"]'
      )?.value || "";

    $("messageRows").innerHTML =
      messageRows(query);
  }
}


function showNotification(id, text) {
  notificationTarget = id;

  $("notification").innerHTML = `
    <small>메시지 · 지금</small>
    <strong>${esc(contact(id).name)}</strong>
    <span>${esc(text)}</span>
  `;

  $("notification").hidden = false;
  clearTimeout(notificationTimer);

  notificationTimer = setTimeout(() => {
    $("notification").hidden = true;
  }, 6500);
}

$("notification").onclick = () => {
  if (!activeCall) openChat(notificationTarget);
};

      return tabMatches && queryMatches;

    .map(postHTML)
    .join("") || '<div class="empty">표시할 게시물이 없어.</div>';

      <div id="contactRows">${contactRows()}</div>

  }

  return `
    <section class="app">
      ${appbar("전화")}
      <div class="scroll">${body}</div>

      <nav class="tabbar">
        ${[
          ["recents", "clock", "최근 통화"],
          ["contacts", "contacts", "연락처"],

}

/* 인터넷 앱 */

function browserPage() {
  return browserHistory[browserIndex];
}

function browserPush(page) {
  browserHistory = browserHistory.slice(0, browserIndex + 1);
  browserHistory.push(page);
  browserIndex++;
  render();
}

function newsRows(page) {
  const q = (page.query || "").toLowerCase();

  return CONFIG.news
    .filter(n => {
      const categoryMatches = n.category === page.category;
      const sectionMatches =
        page.section === "홈" || n.section === page.section;
      const searchMatches =
        (n.title + " " + n.body + " " + n.source)
          .toLowerCase().includes(q);

      return categoryMatches && sectionMatches && searchMatches;
    })
    .map(n => `
      <button class="news-row"
        data-action="article" data-id="${esc(n.id)}">

        <div class="news-copy">
          <div class="news-title">${esc(n.title)}</div>
          <div class="news-meta">
            ${esc(n.source)} · ${esc(n.time)}
          </div>
        </div>

        ${n.image
          ? img(n.image, "news-thumb", n.title)
          : `
            <span class="news-thumb news-placeholder">
              ${icon("news")}
              <span>${esc(n.source)}</span>
            </span>
          `}
      </button>
    `).join("") || `
      <div class="empty">
        표시할 기사가 없어.<br>
        CONFIG.news에 이 분류의 기사를 추가해 줘.
      </div>

}

      <strong>${esc(page.category)}</strong>

    <div class="news-search">

function articleHTML(article) {

/* 자동 이벤트 */

function startExperience() {
  if (started) return;
  started = true;

  CONFIG.events.forEach((event, index) => {
    if (state.completedEvents.includes(index)) return;

    const timer = setTimeout(() => {
      state.completedEvents.push(index);
      save();

      if (event.type === "message") {
        receiveMessage(event.contact, event.text);
      }

      if (event.type === "call") {
        if (activeCall || !$("dialog").hidden) {
          pendingCalls.push(event.contact);
        } else {
          startCall(event.contact, true);
        }
      }
    }, Math.max(0, event.after) * 1000);

    eventTimers.push(timer);
  });
}

function unlock() {
  startExperience();
  go("home");
}

$("homebar").onclick = () => {
  if (activeCall || !$("dialog").hidden) return;

  if (view.app === "lock") unlock();
  else go("home");
};

let swipeStart = null;

$("main").addEventListener("pointerdown", event => {
  if (view.app === "lock" && !event.target.closest("button")) {
    swipeStart = {
      x: event.clientX,
      y: event.clientY
    };
  }
});

$("main").addEventListener("pointerup", event => {
  if (
    swipeStart &&
    view.app === "lock" &&
    swipeStart.y - event.clientY > 45 &&
    Math.abs(swipeStart.x - event.clientX) < 100
  ) {
    unlock();
  }

  swipeStart = null;
});

$("main").addEventListener("pointercancel", () => {
  swipeStart = null;
});

/* 통화 */

function blockUnderlay(block) {
  $("main").inert = block;
  $("homebar").inert = block;
  $("notification").inert = block;
}

function startCall(id, incoming) {
  if (activeCall) return;

  if (!$("dialog").hidden) {
    if (incoming) pendingCalls.push(id);
    return;
  }

  const c = contact(id);

  activeCall = {
    id,
    incoming,
    connected: false,
    logged: false,
    seconds: 0,
    timers: [],
    interval: null
  };

  callFocus = document.activeElement;

  $("notification").hidden = true;
  $("call").hidden = false;
  blockUnderlay(true);

  $("call").innerHTML = `
    <div class="call-avatar">${esc(c.emoji)}</div>
    <div class="call-name">${esc(c.name)}</div>
    <div class="call-state" id="callState">
      ${incoming ? "iPhone · 전화 수신 중" : "전화 거는 중…"}
    </div>

    <div class="call-script" id="callScript" aria-live="polite"></div>

    <div class="call-actions">
      <div class="call-action">
        <button class="call-reject" data-action="end-call"
          aria-label="${incoming ? "거절" : "종료"}">
          ${icon("phone")}
        </button>
        <span id="endCallLabel">${incoming ? "거절" : "종료"}</span>
      </div>

      <div class="call-action" id="answerAction"
        ${incoming ? "" : "hidden"}>
        <button class="call-answer" data-action="answer-call"
          aria-label="전화 받기">
          ${icon("phone")}
        </button>
        <span>받기</span>
      </div>
    </div>
  `;

  $("call").querySelector("button").focus();

  if (incoming) {
    activeCall.timers.push(
      setTimeout(() => endCall(true), 25000)
    );
  } else {
    activeCall.timers.push(
      setTimeout(() => {
        if (CONFIG.contacts.some(c => c.id === id)) {
          answerCall();
        } else {
          $("callState").textContent = "연결할 수 없는 번호야.";
          activeCall.timers.push(
            setTimeout(() => endCall(false), 2200)
          );
        }
      }, 1800)
    );
  }
}

function logCall(missed) {
  if (!activeCall || activeCall.logged) return;

  activeCall.logged = true;

  state.calls.unshift({
    id: activeCall.id,
    incoming: activeCall.incoming,
    missed,
    time: nowTime()
  });

  state.calls = state.calls.slice(0, 60);
  save();
}

function answerCall() {
  if (!activeCall || activeCall.connected) return;

  activeCall.timers.forEach(clearTimeout);
  activeCall.timers = [];
  activeCall.connected = true;

  logCall(false);

  $("answerAction").hidden = true;
  $("endCallLabel").textContent = "종료";
  $("callState").textContent = "00:00";

  const endButton = $("call").querySelector(".call-reject");
  endButton.setAttribute("aria-label", "통화 종료");
  endButton.focus();

  activeCall.interval = setInterval(() => {
    if (!activeCall) return;

    activeCall.seconds++;

    const minutes = String(
      Math.floor(activeCall.seconds / 60)
    ).padStart(2, "0");

    const seconds = String(
      activeCall.seconds % 60
    ).padStart(2, "0");

    $("callState").textContent = minutes + ":" + seconds;
  }, 1000);

  const c = contact(activeCall.id);

  const lines = c.callLines?.length
    ? c.callLines
    : ["CONFIG.contacts에서 통화 대사를 입력해 줘."];

  lines.forEach((line, index) => {
    activeCall.timers.push(
      setTimeout(() => {
        if (!activeCall) return;

        const paragraph = document.createElement("p");
        paragraph.textContent = line;

        $("callScript").replaceChildren(paragraph);
        $("callScript").scrollTop = $("callScript").scrollHeight;
      }, 700 + index * 3500)
    );
  });

  if (c.audio) {
    callAudio = new Audio(safeURL(c.audio));

    callAudio.play().catch(() => {
      toast("음성 파일 이름을 확인해 줘. 재생하지 못했어.");
    });
  }
}

function runPendingCall() {
  if (activeCall || !$("dialog").hidden || !pendingCalls.length) return;

  const id = pendingCalls.shift();

  setTimeout(() => {
    if (activeCall || !$("dialog").hidden) {
      pendingCalls.unshift(id);
    } else {
      startCall(id, true);
    }
  }, 800);
}

function endCall(missed = false) {
  if (!activeCall) return;

  const id = activeCall.id;
  const incoming = activeCall.incoming;

  logCall(missed);

  activeCall.timers.forEach(clearTimeout);
  clearInterval(activeCall.interval);

  if (callAudio) {
    callAudio.pause();
    callAudio = null;
  }

  activeCall = null;
  $("call").hidden = true;
  blockUnderlay(false);

  if (view.app === "phone" && view.tab === "recents") {
    render();
  }

  if (callFocus?.isConnected) {
    callFocus.focus();
  }

  if (missed && incoming) {
    toast(contact(id).name + " · 부재중 전화");
  }

  runPendingCall();
}

/* 확인창과 안내 */

function toast(text) {
  $("toast").textContent = text;
  $("toast").hidden = false;

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    $("toast").hidden = true;
  }, 3200);
}

function ask(title, text, callback) {
  dialogFocus = document.activeElement;
  dialogCallback = callback;

  $("dialog").innerHTML = `
    <div class="dialog-card">
      <strong id="dialogTitle">${esc(title)}</strong>
      <p>${esc(text)}</p>
      <div class="dialog-actions">
        <button data-action="cancel-dialog">취소</button>
        <button data-action="confirm-dialog" class="danger">확인</button>
      </div>
    </div>
  `;

  $("dialog").hidden = false;
  blockUnderlay(true);
  $("dialog").querySelector("button").focus();
}

function closeDialog() {
  $("dialog").hidden = true;
  dialogCallback = null;
  blockUnderlay(false);

  if (dialogFocus?.isConnected) {
    dialogFocus.focus();
  }
}

function togglePostValue(key, id) {
  const list = state[key];
  const index = list.indexOf(id);

  if (index === -1) list.push(id);
  else list.splice(index, 1);

  save();

  const scroll = document.querySelector(".scroll");
  const position = scroll?.scrollTop || 0;
  const input = document.querySelector('[data-search="posts"]');
  const query = input?.value || "";

  render();

  if ($("postRows")) {
    document.querySelector('[data-search="posts"]').value = query;
    $("postRows").innerHTML = postRows(query);
  }

  const newScroll = document.querySelector(".scroll");
  if (newScroll) newScroll.scrollTop = position;
}

/* 클릭 처리 */

document.addEventListener("click", event => {
  const button = event.target.closest("[data-action]");

  if (!button || button.disabled || button.closest("[inert]")) return;

  if (activeCall && !button.closest("#call")) return;
  if (!$("dialog").hidden && !button.closest("#dialog")) return;

  const action = button.dataset.action;
  const id = button.dataset.id;

  switch (action) {
    case "home":
      go("home");
      break;

    case "app":
      startExperience();
      go(button.dataset.app);
      break;

    case "lock":
      go("lock");
      break;

    case "flash":
      flash = !flash;
      $("flashlightGlow").hidden = !flash;
      button.classList.toggle("active", flash);
      button.setAttribute("aria-pressed", String(flash));
      break;

    case "lock-camera":
      startExperience();
      go("photos");
      break;

    case "music":
      toast(CONFIG.musicTitle + " · " + CONFIG.musicArtist);
      break;

    case "open-chat":
      openChat(id);
      break;

    case "message-list":
      go("messages");
      break;

    case "note-list":
      go("notes");
      break;

    case "open-note":
      go("notes", { id });
      break;

    case "new-note": {
      const note = {
        id: uid("note"),
        title: "",
        body: ""
      };

      state.notes.unshift(note);
      save();
      go("notes", { id: note.id });
      $("noteTitle").focus();
      break;
    }

    case "delete-note":
      ask("메모 삭제", "이 메모를 삭제할까?", () => {
        state.notes = state.notes.filter(n => n.id !== id);
        save();
        go("notes");
      });
      break;

    case "twitter-list":
      go("twitter");
      break;

    case "social-tab":
      go("twitter", { tab: button.dataset.tab });
      break;

    case "compose-post":
      go("twitter", { compose: !view.compose });
      break;

    case "open-post":
      go("twitter", { post: id });
      break;

    case "like":
      togglePostValue("likes", id);
      break;

    case "bookmark":
      togglePostValue("bookmarks", id);
      break;

    case "phone-tab":
      go("phone", { tab: button.dataset.tab });
      break;

    case "call-contact":
      startCall(id, false);
      break;

    case "dial-key":
      if (dial.length < 20) {
        dial += button.dataset.key;
      }

      $("dialNumber").textContent = dial;
      break;

    case "dial-delete":
      dial = dial.slice(0, -1);
      $("dialNumber").textContent = dial;
      break;

    case "dial-call": {
      if (!dial) {
        toast("번호를 입력해 줘.");
        break;
      }

      const c = CONFIG.contacts.find(c => c.number === dial);
      startCall(c?.id || dial, false);
      break;
    }

    case "answer-call":
      answerCall();
      break;

    case "end-call":
      endCall(false);
      break;

    case "browser-back":
      if (browserIndex > 0) {
        browserIndex--;
        render();
      }
      break;

    case "browser-forward":
      if (browserIndex < browserHistory.length - 1) {
        browserIndex++;
        render();
      }
      break;

    case "browser-start":
      browserPush({
        page: "list",
        category: "연예",
        section: "뉴스",
        query: ""
      });
      break;

    case "browser-refresh":
      render();
      toast("새로고침했어.");
      break;

    case "news-category":
      browserPush({
        page: "list",
        category: button.dataset.category,
        section: "뉴스",
        query: ""
      });
      break;

    case "news-section":
      browserPush({
        ...browserPage(),
        page: "list",
        section: button.dataset.section,
        query: ""
      });
      break;

    case "article":
      browserPush({
        page: "article",
        id
      });
      break;

    case "open-photo":
      go("photos", { index: Number(button.dataset.index) });
      break;

    case "photo-list":
      go("photos");
      break;

    case "replay-events":
      eventTimers.forEach(clearTimeout);
      eventTimers = [];
      pendingCalls = [];
      state.completedEvents = [];
      save();
      started = false;
      startExperience();
      toast("지금부터 자동 이벤트를 다시 재생해.");
      break;

    case "reset":
      ask(
        "데이터 초기화",
        "메모·문자·게시물·통화 기록을 처음 상태로 되돌릴까?",
        () => {
          eventTimers.forEach(clearTimeout);
          replyTimers.forEach(clearTimeout);

          eventTimers = [];
          replyTimers = [];
          pendingCalls = [];

          state = initialState();
          save();

          started = false;
          flash = false;

          $("flashlightGlow").hidden = true;
          $("notification").hidden = true;

          clearTimeout(notificationTimer);
          go("lock");
        }
      );
      break;

    case "cancel-dialog":
      closeDialog();
      runPendingCall();
      break;

    case "confirm-dialog": {
      const callback = dialogCallback;
      closeDialog();
      callback?.();
      runPendingCall();
      break;
    }
  }
});

/* 입력 처리 */

document.addEventListener("input", event => {
  const input = event.target;

  if (input.id === "noteTitle" || input.id === "noteBody") {
    persistNote();
  }

  switch (input.dataset.search) {
    case "messages":
      $("messageRows").innerHTML = messageRows(input.value);
      break;

    case "notes":
      $("noteRows").innerHTML = noteRows(input.value);
      break;

    case "posts":
      $("postRows").innerHTML = postRows(input.value);
      break;

    case "contacts":
      $("contactRows").innerHTML = contactRows(input.value);
      break;

    case "news":
      browserPage().query = input.value;
      $("newsRows").innerHTML = newsRows(browserPage());
      break;
  }
});

document.addEventListener("change", event => {
  if (event.target.id === "clockToggle") {
    state.liveClock = event.target.checked;
    save();
  }
});

/* 전송 처리 */

document.addEventListener("submit", event => {
  const form = event.target;
  event.preventDefault();

  if (form.id === "messageForm") {
    sendMessage(String(new FormData(form).get("message") || ""));
  }

  if (form.id === "tweetForm") {
    const text = String(
      new FormData(form).get("post") || ""
    ).trim();

    if (!text) return;

    state.posts.unshift({
      id: uid("post"),
      ...CONFIG.profile,
      time: "지금",
      text,
      image: "",
      likes: 0,
      comments: []
    });

    save();
    go("twitter");
  }

  if (form.id === "commentForm") {
    const text = String(
      new FormData(form).get("comment") || ""
    ).trim();

    if (!text) return;

    const post = state.posts.find(p => p.id === view.post);
    if (!post) return;

    post.comments = post.comments || [];

    post.comments.push({
      name: CONFIG.profile.name,
      text
    });

    save();
    render();
  }
});

/* 확인창과 전화 화면 키보드 이동 */

document.addEventListener("keydown", event => {
  const modal = !$("dialog").hidden
    ? $("dialog")
    : !$("call").hidden
      ? $("call")
      : null;

  if (!modal) return;

  if (event.key === "Escape" && modal.id === "dialog") {
    closeDialog();
    runPendingCall();
    return;
  }

  if (event.key !== "Tab") return;

  const buttons = [...modal.querySelectorAll("button")]
    .filter(button => button.getClientRects().length > 0);

  const first = buttons[0];
  const last = buttons.at(-1);

  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
});

/* 잘못된 이미지 파일은 깨진 아이콘 대신 숨기기 */

document.addEventListener("error", event => {
  if (event.target.tagName === "IMG") {
    event.target.style.visibility = "hidden";
    event.target.parentElement.setAttribute(
      "aria-label",
      "이미지 파일 이름을 확인해 주세요"
    );
  }
}, true);

render();
</script>
   <script>
(() => {
  // 실수로 두 번 붙여넣어도 중복 실행하지 않음
  if (window.__prisonCallbackV1) return;
  window.__prisonCallbackV1 = true;

  const oldStartCall = startCall;
  const oldEndCall = endCall;

  function progressMap() {
    if (!state.callbackStories) {
      state.callbackStories = {};
    }

    return state.callbackStories;
  }

  function isCurrent(id, request) {
    const p = progressMap()[id];

    return p &&
      p.pending &&
      p.next === request.step &&
      p.ticket === request.ticket;
  }

  function scheduleStory(id, delay) {
    const p = progressMap()[id];

    if (!p || !p.pending) return;

    p.ticket = uid("call");

    p.dueAt =
      Date.now() + Math.max(0, delay) * 1000;

    const request = {
      step: p.next,
      ticket: p.ticket
    };

    save();

    eventTimers.push(setTimeout(() => {
      if (isCurrent(id, request)) {
        startCall(id, true, request);
      }
    }, Math.max(0, delay) * 1000));
  }

  function beginStory(event) {
    const c = contact(event.contact);

    const followUps =
      Array.isArray(event.followUpCalls)
        ? event.followUpCalls
        : typeof event.followUpAfter === "number"
          ? [{
              after: event.followUpAfter,
              lines: event.followUpLines || []
            }]
          : [];

    progressMap()[event.contact] = {
      next: 0,
      attempts: 0,
      pending: true,
      ticket: uid("call"),
      dueAt: null,

      maxAttempts: Math.min(
        3,
        Math.max(
          1,
          Number(event.maxAttempts) || 3
        )
      ),

      retryAfter: Math.max(
        0,
        Number(event.retryAfter) || 5
      ),

      ringSeconds: Math.max(
        1,
        Number(event.ringSeconds) || 25
      ),

      steps: [
        {
          after: 0,
          lines: clone(c.callLines || []),
          audio: c.audio || ""
        },

        ...followUps.map(item => ({
          after: Math.max(
            0,
            Number(item.after) || 0
          ),
          lines: clone(item.lines || []),
          audio: item.audio || ""
        }))
      ]
    };

    scheduleStory(event.contact, 0);
  }

  // 자동 문자와 전화 시작
  startExperience = function () {
    if (started) return;
    started = true;

    // 새로고침 전에 예약된 후속 전화 복원
    Object.entries(progressMap()).forEach(([id, p]) => {
      if (p.pending && p.dueAt !== null) {
        scheduleStory(
          id,
          Math.max(
            0,
            (p.dueAt - Date.now()) / 1000
          )
        );
      }
    });

    CONFIG.events.forEach((event, index) => {
      if (state.completedEvents.includes(index)) return;

      eventTimers.push(setTimeout(() => {
        state.completedEvents.push(index);
        save();

        if (event.type === "message") {
          receiveMessage(
            event.contact,
            event.text
          );
        }

        if (event.type === "call") {
          beginStory(event);
        }
      }, Math.max(
        0,
        Number(event.after) || 0
      ) * 1000));
    });
  };

  // 수신 전화와 직접 거는 전화 모두 현재 차례 사용
  startCall = function (
    id,
    incoming,
    request = null
  ) {
    if (request && !isCurrent(id, request)) {
      return;
    }

    if (activeCall || !$("dialog").hidden) {
      if (incoming) {
        pendingCalls.push({ id, request });
      }
      return;
    }

    const p = progressMap()[id];

    if (p && p.pending) {
      // 직접 다시 걸면 예약된 중복 수신 전화 취소
      p.ticket = uid("call");
      p.dueAt = null;

      if (incoming) {
        p.attempts++;
      }

      save();
    }

    oldStartCall(id, incoming);

    if (!activeCall) return;

    if (p && p.pending) {
      activeCall.storyStep = p.next;

      activeCall.storyLines =
        clone(p.steps[p.next].lines);

      activeCall.storyAudio =
        p.steps[p.next].audio;

    } else if (p && p.steps.length) {
      // 모든 통화가 끝난 뒤에는 마지막 대사 사용
      activeCall.storyLines =
        clone(p.steps.at(-1).lines);

      activeCall.storyAudio =
        p.steps.at(-1).audio;
    }

    if (incoming && p) {
      activeCall.timers.forEach(clearTimeout);

      activeCall.timers = [
        setTimeout(
          () => endCall(true),
          p.ringSeconds * 1000
        )
      ];
    }
  };

  answerCall = function () {
    if (!activeCall || activeCall.connected) {
      return;
    }

    activeCall.timers.forEach(clearTimeout);
    activeCall.timers = [];
    activeCall.connected = true;

    logCall(false);

    $("answerAction").hidden = true;
    $("endCallLabel").textContent = "종료";
    $("callState").textContent = "00:00";

    const button =
      $("call").querySelector(".call-reject");

    button.setAttribute(
      "aria-label",
      "통화 종료"
    );

    button.focus();

    activeCall.interval = setInterval(() => {
      if (!activeCall) return;

      activeCall.seconds++;

      $("callState").textContent =
        String(
          Math.floor(activeCall.seconds / 60)
        ).padStart(2, "0") +
        ":" +
        String(
          activeCall.seconds % 60
        ).padStart(2, "0");
    }, 1000);

    const c = contact(activeCall.id);

    const lines =
      activeCall.storyLines ??
      c.callLines ??
      [];

    lines.forEach((line, index) => {
      activeCall.timers.push(setTimeout(() => {
        if (!activeCall) return;

        const paragraph =
          document.createElement("p");

        paragraph.textContent = line;

        // 이전 대사는 지우고 현재 대사만 표시
        $("callScript").replaceChildren(
          paragraph
        );
      }, 700 + index * 3500));
    });

    const audio =
      activeCall.storyAudio ?? c.audio;

    if (audio) {
      callAudio = new Audio(
        safeURL(audio)
      );

      callAudio.play().catch(() => {
        toast("음성 파일 이름을 확인해 줘.");
      });
    }
  };

  runPendingCall = function () {
    if (
      activeCall ||
      !$("dialog").hidden ||
      !pendingCalls.length
    ) return;

    const item = pendingCalls.shift();

    eventTimers.push(setTimeout(() => {
      if (typeof item === "string") {
        startCall(item, true);
      } else {
        startCall(
          item.id,
          true,
          item.request
        );
      }
    }, 800));
  };

  endCall = function (missed = false) {
    if (!activeCall) return;

    const {
      id,
      incoming,
      connected,
      storyStep
    } = activeCall;

    const p = progressMap()[id];

    oldEndCall(incoming && !connected);

    if (
      !p ||
      !p.pending ||
      p.next !== storyStep
    ) return;

    if (connected) {
      // 받고 종료한 경우에만 다음 차례로 이동
      p.next++;
      p.attempts = 0;
      p.ticket = uid("call");
      p.dueAt = null;
      p.pending = p.next < p.steps.length;

      save();

      if (p.pending) {
        scheduleStory(
          id,
          p.steps[p.next].after
        );
      }

    } else {
      // 놓쳤거나 거절했다면 대사 차례 유지
      p.dueAt = null;
      save();

      const limit =
        p.next === 0
          ? p.maxAttempts
          : 1;

      if (
        incoming &&
        p.attempts < limit
      ) {
        scheduleStory(id, p.retryAfter);
      }
    }
  };

  // 다시 재생 버튼을 누르면 통화 차례도 초기화
  document.addEventListener("click", event => {
    const button = event.target.closest(
      '[data-action="replay-events"]'
    );

    if (
      !button ||
      button.closest("[inert]")
    ) return;

    state.callbackStories = {};
    save();
  }, true);
})();
</script>
